# Lowcap Call Tracker — default configuration.
#
# Copy this file (or point --config at it) and edit locally. Every threshold the
# workflow depends on lives here; scripts never hardcode a tunable value.
schema_version: 1

tracker:
  # SQLite database holding calls, shadow calls, role verdicts and price history.
  db_path: state/lowcap_calls.db
  # Per-run artifacts follow the repository convention (reports/ is gitignored).
  reports_dir: reports/lowcap-tracker
  # These two are committed and pushed after each run so they can be read from a
  # phone, so they live in a tracked directory, not under reports/.
  stats_file: tracker-output/stats.md
  improvements_file: tracker-output/improvements.md
  # Calls are expressed as OPTIONS (call / put) and close when the contract
  # expires — that is the only close rule.
  close_on_expiry: true
  # Legacy premium/underlying stop-out, disabled. Set a negative number to
  # re-enable an early close at that PnL on the underlying.
  close_threshold_pct: null
  # TRAILING STOP, in percent below the highest price seen since entry. The
  # high-water mark starts AT the entry price, so a call that never gains
  # carries a plain stop at the same distance — one rule, not two. Measured on
  # the underlying, checked on every price update. null disables it.
  #
  # A FLAT 15%. It is the whole rule, not a floor — see trailing_stop_atr_mult.
  #
  # History, because this number has moved twice and both moves are informative:
  #
  # * 15% originally, chosen from this tracker's own record — every call peaked
  #   (+25.9% average) and gave it all back holding to expiry (-0.1% average),
  #   and a 15% trail on the same price paths returned +10.0% with 4 of 6 green.
  # * 25% on 2026-10-13 (operator: "if a position is up 100% and goes down 25%
  #   it should close the position").
  # * Back to 15% on 2026-10-17 (operator: "add a 15% trail in future"), after
  #   two live cases of the wider trail handing back a large move: VEEA banked
  #   +35.8% where 15% would have banked about +62.5%, and NCPL peaked at
  #   +49.4% then sat at +17.8% with its 25% stop still 4.9% below.
  #
  # The cost of 15% is equally real and was why it was widened: it closes
  # positions on a single session of noise in a universe whose average daily
  # range is a quarter of the price. Neither number is obviously right. This one
  # is the operator's.
  #
  # "IN FUTURE" is the default, not a special case: the distance is resolved at
  # entry and stored on the row (calls.trail_pct), so editing this moves new
  # calls only. On the day of this change, retrailing the open book would have
  # closed AISP, FEAM, USDE and NCPL on the next price update — all four were
  # further off their highs than 15%. `scripts/retrail.py` is the deliberate
  # step that moves open positions onto a new setting, and it names any such
  # position before it writes.
  trailing_stop_pct: 15.0
  # When set, the trail is widened to this multiple of the instrument's own ATR,
  # as a percentage of the entry price, whenever that is wider than the floor:
  #     trail = max(trailing_stop_pct, mult x ATR / entry x 100)
  # Resolved once per call at entry and stored on the row, so changing this
  # never re-stops a position that is already open.
  #
  # SWITCHED OFF (null) on 2026-10-13. The operator asked for a 25% trailing stop, and
  # a 25% floor under a 1.5x ATR multiplier is not one: on the live book it
  # resolved to 40.3% on VEEA, 49.0% on XRPN and 37.7% on MEDS, so the number
  # in the config was not the number in force on the positions that mattered.
  # One flat distance, the same on every call, is what was asked for and what
  # can be checked by eye. The scaling machinery stays in the code
  # (resolve_trail_pct) so setting a multiplier here restores it unchanged.
  #
  # Why it existed, for whoever considers turning it back on: a fixed 15% was
  # narrower than one session on most of this universe (6 of the first 10 calls
  # carried an ATR above 13% of entry, 4 above 22%), and replaying the book on
  # daily closes gave +9.2% per call on the fixed 15% against +11.7% at 1.5x
  # ATR. That was never proof — 6 closed calls is not a sample and one name
  # (SDEV +149%) supplied all the profit under both rules — and the cost showed
  # too: GRML banked +11.1% on the floor and -2.8% on the wider trail. At a 25%
  # flat trail the noise argument is also much weaker than it was at 15%.
  trailing_stop_atr_mult: null
  # Which high the trail measures from.
  #
  # false (default): the highest price a SCAN SAMPLED. A scan reads a price at
  # whatever moment it runs, so this understates the real high by however much
  # of the move it missed — on 2026-10-01 SDEV printed 4.54 intraday and the
  # recorded peak was 4.24, a 7% understatement, which loosened that call's stop
  # from 3.62 to 3.39 and is the only reason it was not closed that day.
  #
  # true: the session's High, which is what "trailing stop" normally means.
  # Stops become tighter and correct rather than accidentally loose.
  #
  # Left false so the geometry never tightens under an operator who has not
  # asked for it. The evidence either way is one call: on SDEV the loose stop
  # held and closed +14.1%, while the old fixed 15% trail measured from the TRUE
  # high would have banked +20.6% — better than holding. That is one data point
  # against a 6-call replay, and not enough to settle it.
  peak_from_session_high: false
  # MARK ON EXTENDED HOURS. A daily bar does not exist until the regular session
  # makes one, so before the open the book held the previous close: at 05:38 ET
  # on 5 October SDEV traded 10.39 while the mark read Friday's 7.48, a real
  # +224.7% showing as +133.8%. With this on, the newest pre/post-market print
  # becomes the mark whenever it is newer than the daily close, and the report
  # tags it EXT.
  # WHICH CALLS THE ACCOUNT FUNDS.
  #
  # all (default): every call the screener surfaced, whatever the Judge said.
  #   This is the operator's actual behaviour — they take the hits — so this is
  #   the real account PnL.
  # take_only: only calls the Judge said TAKE, i.e. what following the Judge
  #   would have returned.
  #
  # Both are always computed and reported; this only decides which one is
  # labelled the account. Anything other than take_only funds everything, so a
  # typo cannot silently shrink the account to a single call.
  # FIXED STOP LOSS, in percent below the ENTRY price, used by v2.
  #   stop = entry_price x (1 - sl_pct/100)
  # Unlike the trailing stop this never moves: it is the line the outcome
  # tracker checks each day's LOW against, and the number quoted in every TAKE
  # that goes to Telegram. Long only, so the stop is always below entry.
  # Widened from 20 to 30 on 2026-10-08 (operator decision). Resolved per call
  # at entry, so changing this moves new calls only; an open call keeps the
  # line it was taken with unless the operator re-sets it.
  sl_pct: 30.0
  account_funds: all
  mark_extended_hours: true
  # Whether an extended print with ZERO volume may CLOSE a position.
  #
  # It is a quote nobody traded, not a price. Letting one act is how the MEDS
  # 5.16 entry was taken at the top of a 6am spike on bars reporting no volume
  # at all. Left false, an untraded print still moves the mark, the PnL and the
  # peak — so the number you see is current — but the trailing stop waits for a
  # price somebody actually paid. Set true to let it close positions as well.
  stop_on_untraded_extended: false
  # Contract defaults the RISK MANAGER may override per setup.
  options:
    # Days to expiration when nothing about the setup argues otherwise.
    default_dte: 30
    # A fade of a climactic move needs less time than a catalyst-driven trend.
    fade_dte: 21
    catalyst_dte: 45
    # US options expire on Fridays; the chosen date is snapped to one.
    snap_to_friday: true
    # Warn in reports when a call is this close to expiry.
    expiry_warning_days: 7
  # Equal-weight assumption used for "total portfolio PnL" across TAKE calls.
  equal_weight_pct: 100.0
  # The account the tracker is pretending to run. Every call takes a fixed
  # slice of it at entry; what is not in a position is cash.
  account_size: 1000.0
  # Dollars per call, as a percent of account_size. 10% -> $100 a call and room
  # for ten positions. The last position gets whatever cash is actually left.
  position_pct: 10.0
  # MOST OPEN POSITIONS AT ONCE. Operator decision 2026-10-15: "only accept 10
  # open positions at a time as total portfolio is allocated then".
  #
  # Ten slices of 10% ARE the account, so this and the cash normally say the
  # same thing — they part company the moment a position is a PART slice (the
  # last one funded, or one funded out of a rotation), because the leftover
  # cash would otherwise open an eleventh position in a book already fully
  # committed in intent. The count is the rule; the cash agreeing with it is a
  # coincidence. Keep it equal to 100 / position_pct.
  #
  # Only FUNDED positions count: an unfunded call holds no money and cannot be
  # occupying a slot that exists because the money runs out. A full book is
  # not a closed door — a new TAKE may still displace a position (see
  # rotation), and rotation fires on a full count as well as on empty cash.
  # null removes the cap and leaves the cash as the only limit.
  max_open_positions: 10
  # WHAT HAPPENS WHEN THE ACCOUNT IS FULLY COMMITTED.
  #
  # true (default): a call that cannot be funded — after rotation has had its
  #   chance — is NOT MADE. It appears in the report as a capital skip, with
  #   the dollars it wanted, and nothing is written to the database.
  # false: the old behaviour. The call is recorded with no allocation and
  #   tracked unvalued.
  #
  # Set true on 2026-10-13 (operator decision: "the $ should be managed also
  # with the calls, not in parallel"). The old behaviour ran two ledgers: the
  # screener kept calling, and six of seventeen open calls were carrying no
  # money while reading in the report exactly like the eleven that were. One
  # of them — NCPL, the best name in the book — was holding 47 cents.
  #
  # The cost of the gate is real and worth stating: a capital skip leaves no
  # row, so the v1-vs-v2 outcome experiment never measures that hit. The
  # alternative measured hits the account never took, which is worse.
  capital_gated: true
  # CAPITAL ROTATION — closing a position to fund a better call.
  #
  # Every key is a brake; see rotation.py for why each one exists.
  rotation:
    # Master switch. Off means a full book simply stops funding.
    enabled: true
    # Only a call the Judge said TAKE may displace an open position.
    require_take: true
    # Never displace a position that is up. A rule that sells winners to buy
    # screener hits turns a good book into a bad one.
    protect_winners: true
    # A position must be at least this far down to be displaced, in percent.
    # Kept at 0 so a flat position is left alone; protect_winners clamps any
    # positive value here back to 0.
    max_displace_pnl_pct: 0.0
    # The newcomer's confidence must be HIGHER than the displaced position's,
    # strictly. Equal is not higher: a coin toss is not a reason to sell one
    # position to buy another. Operator decision 2026-10-15 ("only rotate
    # capital if the confidence is higher"), and the reason it is a separate
    # key from the margin below is that a margin of 0 would otherwise read "a
    # difference of at least nothing", which admits a tie.
    require_higher_confidence: true
    # An ADDITIONAL margin on top, in confidence points. 0 means the strict
    # comparison above is the whole rule, which is what was asked for.
    #
    # It shipped at 10 on the reasoning that 75 against 70 is noise, and that
    # is still the argument for raising it: this book's 70-100 confidence
    # bucket is 0 for 7 and averaging -30.1%, so small differences in
    # confidence are currently measuring nothing. Set it back to 10 to make
    # rotation demand a real gap.
    min_confidence_edge: 0
    # Most positions one run may close for cash. A pre-market batch must not
    # be able to recycle the whole account before the open.
    max_per_run: 3
    # Rotation stops once the freed cash covers this fraction of a full slice,
    # and the call takes a part slice rather than a second position being sold
    # for the remainder. Added 2026-10-14 after the first live rotation freed
    # $89.63 of a $100 slice and the loop then closed a position 2.1% down for
    # the missing $10.37 — whose money then went to the next call in the run,
    # while the close reason named this one. 1.0 restores the strict rule.
    min_fill_fraction: 0.8
  risk_pct: 1.0
  max_position_pct: 10.0
  # Safety valve: never open more than this many new calls in one run.
  max_new_calls_per_run: 10
  # JSON state snapshot (git-friendly). A run imports it into an EMPTY database
  # and rewrites it afterwards, which is what lets a run on a fresh checkout keep
  # dedupe state and PnL history. Import refuses a database that already holds
  # calls, so setting this can never clobber live state.
  #
  # TURNED ON 2026-10-21, after the whole book was lost. This was null with the
  # note "a server with a real disk does not need it" — and the tracker was not
  # running on a server with a real disk. It was running in a container whose
  # disk is reclaimed, against a database outside the repository, so when the
  # container was recycled on 2026-10-20 the entire 43-call history went with
  # it. The snapshot is committed, so from now on the book survives in git.
  #
  # The cost is that every run rewrites a tracked file; that is the point.
  snapshot_file: tracker-output/state_snapshot.json
  # Subscribers and invite codes, exported beside the snapshot when one is in
  # use. Deliberately under state/ (gitignored): an invite code is a shared
  # secret and a chat id identifies a person, so neither may be committed.
  members_file: state/lowcap_members.json

screener:
  # WHICH SCREENER GENERATION RUNS: v1 or v2. See screener.versions below.
  # Every call is tagged with this in the database (calls.screener_version), so
  # switching back and forth never makes the history ambiguous.
  #
  # v2 is the standing generation (operator decision, 2026-10-07). This brings
  # in v2's earliest_run gate: a run before 16:30 Europe/Zurich logs a skip and
  # prices the open book without screening. v1 stays fully runnable for a
  # one-off with `run_cycle.py --screener-version v1`.
  screener_version: v2
  # auto -> elite when FINVIZ_API_KEY is set, else public HTML.
  mode: auto
  # Public HTML pages to walk per view (20 rows per page).
  max_pages: 2
  # OTC exclusion strategy:
  #   explicit     -> exch_amex|nasd|nyse multi-select (Elite multi-select syntax)
  #   universe     -> rely on FinViz's listed-exchange universe (public-safe)
  #   per_exchange -> one pass per exchange, merged (public-safe, 3x requests)
  #   auto         -> explicit in Elite mode, universe in public mode
  exchange_mode: auto
  exchanges: [amex, nasd, nyse]
  # FinViz view codes merged per variant (ownership carries Float / Short Float).
  views:
    overview: 111
    ownership: 131      # Float, Float Short (stocks only)
    performance: 141    # Rel Volume, Avg Volume, period performance
    technical: 171      # SMA20/50/200 distance, 52W High/Low, RSI, ATR
  # Seconds between HTTP requests (public HTML mode is rate-limit sensitive).
  request_delay_seconds: 1.5
  # Rows whose exchange is reported and is not in this set are dropped.
  allowed_exchanges: [AMEX, NASD, NASDAQ, NYSE, NYSE ARCA, ARCA, BATS, CBOE]

  # ------------------------------------------------------------------ versions
  # Two screener generations live side by side. `screener_version` at the top of
  # this file chooses which one runs; both stay runnable, and every call is
  # tagged in the database with the version that produced it so v1 and v2 can be
  # compared on outcomes rather than on opinion.
  #
  # v1 is the original, preserved byte-for-byte. Do not edit it: the whole point
  # of keeping it is that its historical calls remain explainable.
  versions:
    v1:
      label: "v1 — original (3 variants, hard short-float floor)"
      variants:
        squeeze:
          asset_type: stock
          label: Squeeze (high short float, low float)
          views: [overview, ownership, performance, technical]
          filters:
            - cap_smallunder      # market cap under $2B (small + micro + nano)
            - sh_price_1to20      # price $1-$20 (custom range)
            - sh_avgvol_o500      # average volume over 500K
            - sh_relvol_o2        # relative volume over 2
            - ta_perf_dup         # up today
            - ta_sma20_pa         # price above SMA20
            - ta_sma50_pa         # price above SMA50
            - ind_stocksonly      # exclude funds/ETFs
            - geo_usa             # US companies
            - sh_float_u20        # float under 20M shares
            - sh_short_o15        # short float over 15%
          order: "-relativevolume"
          view: technical

        momentum_breakout:
          asset_type: stock
          label: Momentum breakout (new 52w high, RelVol > 3)
          views: [overview, ownership, performance, technical]
          filters:
            - cap_smallunder
            - sh_price_1to20
            - sh_avgvol_o500
            - sh_relvol_o3        # relative volume over 3 (variant-specific)
            - ta_perf_dup
            - ta_sma20_pa
            - ta_sma50_pa
            - ta_highlow52w_nh    # new 52-week high
            - ind_stocksonly
            - geo_usa
            - sh_float_u20
          # Short float is NOT required here: a fresh 52w-high breakout is not
          # necessarily heavily shorted, and requiring >15% empties the variant.
          # Set short_float_filter to sh_short_o15 to enforce the global floor.
          optional_filters:
            short_float_filter: sh_short_o15
          # Add "short_float_filter" here to enforce the global >15% short-float floor.
          enable_optional: []
          order: "-change"
          view: technical

        etf_momentum:
          asset_type: etf
          label: ETF momentum (new 52w high, RelVol > 2)
          # No ownership view: FinViz publishes no float / short-float data for ETFs,
          # so those filters (and market cap) would drop every ETF row.
          views: [overview, performance, technical]
          filters:
            - ind_exchangetradedfund
            - sh_price_1to20
            - sh_avgvol_o500
            - sh_relvol_o2
            - ta_perf_dup
            - ta_sma20_pa
            - ta_sma50_pa
            - ta_highlow52w_nh
          order: "-change"
          view: technical

    v2:
      label: "v2 — widened squeeze, near-high breakout, no ETFs"
      # Post-screen guards applied in code, not by FinViz. A FinViz filter can
      # only narrow the query; these need the fetched row.
      guards:
        # Skip names already up more than this today. Chasing a +40% move is how
        # MEDS was bought at 5.16 and SDEV at 7.58.
        max_change_pct: 25.0
        # Short float is published roughly twice a month, so it is stale by
        # construction and must never EXCLUDE a name. It is a score bonus only.
        short_float_bonus:
          - { min_pct: 20.0, bonus: 10 }
          - { min_pct: 10.0, bonus: 5 }
      # The operator's own floor on when a scan may screen, in their timezone.
      # 08:00 Zurich is 02:00 ET, before the pre-market tape opens, so in
      # practice the market's extended-hours window (04:00 ET) is the binding
      # constraint and the morning scan screens pre-market. The variants
      # themselves decide which session they are valid in (see `sessions`),
      # which is what replaced the old 16:30 relative-volume floor.
      earliest_run:
        timezone: Europe/Zurich
        time: "08:00"
      # --- Explosion signals (v2 only) -----------------------------------
      # Run on every surviving hit AFTER the FinViz filters and BEFORE the
      # Judge, so the roles argue with the numbers in front of them. Each
      # signal is independent: when its source is unavailable the signal
      # records "n/a", scores nothing, and the cycle carries on. A signal that
      # silently scored 0 on missing data would be indistinguishable from a
      # signal that looked and found nothing.
      explosion_signals:
        enabled: true
        # The whole layer can only add this much. Nine signals at full marks
        # would be +58, which would carry a 20-confidence setup over any
        # threshold — signals are meant to rank good setups, not manufacture
        # them.
        max_total_bonus: 30
        # SEC fair access: EDGAR requires a declared User-Agent naming a real
        # contact, and 10 requests/second is its published ceiling. Without a
        # User-Agent every EDGAR-backed signal reports n/a rather than sending
        # an anonymous request. Set it here or in EDGAR_USER_AGENT.
        edgar:
          user_agent: null        # e.g. "lowcap-tracker you@example.com"
          max_requests_per_second: 8
          timeout_seconds: 15
        signals:
          # Today's volume divided by the free float. One full rotation means
          # the entire tradeable supply changed hands in a session.
          float_rotation:
            enabled: true
            rungs:
              - { min_x: 1.0, points: 10 }
              - { min_x: 0.5, points: 5 }
          # An 8-K or material news inside 24h. For v2 this REPLACES the
          # role-level no_catalyst_penalty: the charge is made here, once,
          # against the filing record rather than against a role's score.
          catalyst_recency:
            enabled: true
            window_hours: 24
            points: 10
            no_catalyst_penalty: 15
            # 8-K is the material-event form; the amendment carries the same
            # weight. 6-K is the foreign-issuer equivalent.
            form_types: ["8-K", "8-K/A", "6-K"]
          # Days to cover is FinViz's short ratio. A high borrow fee says the
          # same thing the ratio does, from the lending side.
          short_squeeze_pressure:
            enabled: true
            min_days_to_cover: 3.0
            min_borrow_fee_pct: 20.0
            points: 5
          # A range in the bottom fifth of its own 60-day history, with volume
          # arriving: coiled, and being hit.
          volatility_contraction:
            enabled: true
            lookback_days: 60
            range_days: 10
            percentile: 20.0
            min_rel_volume: 2.0
            points: 10
          premarket_gap:
            enabled: true
            min_gap_pct: 10.0
            min_volume_pct_of_adv: 20.0
            points: 5
          # The one signal that can go negative on its own: below VWAP means
          # every buyer today is underwater, which is where supply comes from.
          vwap_position:
            enabled: true
            above_points: 5
            below_points: -10
          insider_buying:
            enabled: true
            window_days: 30
            points: 5
            # Form 4 transaction code P is an open-market purchase. An award
            # (A) or an option exercise (M) is not someone spending money.
            transaction_codes: ["P"]
          institutional_ownership:
            enabled: true
            max_pct: 20.0
            points: 3
          sector_sympathy:
            enabled: true
            min_peers: 2
            peer_min_change_pct: 10.0
            points: 5
        # Non-negotiable. Each of these is a reason the move cannot be trusted
        # whatever the rest of the sheet says, so the Judge returns SKIP and
        # names the filter. They are checked for every hit, not only the ones
        # the Judge likes.
        hard_skips:
          dilution_filings:
            enabled: true
            window_days: 90
            # A shelf, an ATM prospectus or fresh warrants are the mechanism by
            # which a lowcap run becomes an exit for the company, not for you.
            form_types: ["S-3", "S-3/A", "S-1", "S-1/A", "424B3", "424B4", "424B5", "F-3"]
          reverse_split:
            enabled: true
            window_days: 180
          cash_runway:
            enabled: true
            min_months: 6.0
          intraday_halts:
            enabled: true
            max_halts: 2        # a third halt in one session is the SKIP
      variants:
        squeeze:
          asset_type: stock
          label: Squeeze v2 (wider float, short float scored not required)
          # Ranks on relative volume and "up today", neither of which exists
          # before the open, so it does not run pre-market.
          sessions: [regular, afterhours]
          views: [overview, ownership, performance, technical]
          filters:
            - cap_smallunder      # market cap under $2B
            - sh_price_1to20      # price $1-$20
            - sh_avgvol_o300      # v1: o500 — 300K lets thinner names through
            - sh_relvol_o2        # relative volume over 2
            - ta_perf_dup         # up today
            - ta_sma20_pa         # price above SMA20
            - ta_sma50_pa         # price above SMA50
            - ind_stocksonly      # exclude funds/ETFs
            - geo_usa             # US companies
            - sh_float_u50        # v1: u20 — the only knob that added names
            # sh_short_o15 REMOVED as a hard filter. Scored via
            # guards.short_float_bonus instead, from the ownership view.
          order: "-relativevolume"
          view: technical

        momentum_breakout:
          asset_type: stock
          label: Momentum breakout v2 (near 52w high, RelVol > 2)
          sessions: [regular, afterhours]
          views: [overview, ownership, performance, technical]
          filters:
            - cap_smallunder
            - sh_price_1to20
            - sh_avgvol_o300
            - sh_relvol_o2            # v1: o3
            - ta_perf_dup
            - ta_sma20_pa
            - ta_sma50_pa
            - ta_highlow52w_b0to5h    # v1: _nh (AT a new high) — within 0-5% of it
            - ind_stocksonly
            - geo_usa
            # sh_float_u20 REMOVED
          order: "-relativevolume"     # v1: -change
          view: technical
          # v1's momentum_breakout never produced a single call. If v2's still
          # has none after this many trading days, the report flags it for
          # deletion rather than leaving dead config in place.
          flag_for_deletion_after_days: 5

        premarket_gap:
          asset_type: stock
          label: Pre-market gap v2 (structural universe, measured gap)
          # The only variant that runs before the open, and the only one whose
          # selection does not come from FinViz. FinViz's public screener has
          # no pre-market filter — `order=-premarketchange` is silently
          # ignored and falls back to ticker order — so these filters are
          # STRUCTURAL only (facts that do not change overnight), and the
          # actual pre-market move is measured from the tape afterwards. Any
          # filter here that depended on today's session would read yesterday
          # and call it today.
          sessions: [premarket]
          views: [overview, ownership]
          filters:
            - cap_smallunder      # market cap under $2B
            - sh_price_1to20      # price $1-$20
            - sh_avgvol_o300      # liquid enough for a gap to mean something
            - sh_float_u50        # float under 50M shares
            - ind_stocksonly
            - geo_usa
          # Most-traded first: the cap below keeps one tape request per name
          # bounded, and liquidity is what makes a gap real rather than one
          # order on an empty book.
          order: "-volume"
          view: overview
          premarket:
            # One tape fetch per name, so the universe is capped before any of
            # it happens. A pre-market scan slower than the pre-market session
            # is useless.
            max_universe: 60
            # Lower than the explosion-signal bonus (which pays at +10% on 20%
            # of ADV): this is the bar to be LOOKED at, not the bar to score.
            min_gap_pct: 5.0
            min_volume_pct_of_adv: 10.0

        # etf_momentum is NOT in v2. It fired once and returned QYLD, a $8.1bn
        # covered-call income fund with 0.44% monthly volatility — a correct
        # match for its filters and the wrong instrument for this strategy.
        # It remains available under v1.

roles:
  # auto -> llm when ANTHROPIC_API_KEY is set and the monthly cap has room,
  # else the deterministic heuristic backend (offline-safe).
  backend: auto
  models:
    worker: claude-haiku-4-5   # RESEARCHER / TECHNICIAN / SKEPTIC / RISK MANAGER
    judge: claude-sonnet-5     # JUDGE
  max_tokens:
    worker: 1200
    judge: 1200
  # Roles that must NOT be faked. If the LLM backend cannot answer for one of
  # these, the hit is recorded UNREVIEWED and reviewed on the next healthy run;
  # a deterministic guess about a catalyst, an objection or a verdict is worse
  # than an honest gap in the record. TECHNICIAN and RISK MANAGER are arithmetic
  # on the screener row, so they keep their offline implementation.
  # Long only. These low-float names have no listed options and are hard to
  # borrow, so a bearish call could never actually be taken — and an
  # inexecutable position in the record collects PnL nobody could have had.
  # A bearish setup becomes instrument "none", which the Judge gate turns into
  # a SKIP. Set true only if the universe changes to optionable names.
  allow_short: false
  llm_only: [researcher, skeptic, judge]
  # Fail the whole run's review when one tiny API call cannot be made, instead
  # of discovering it role by role.
  health_check: true
  # The RESEARCHER searches the web: a catalyst lives in news, filings and press
  # releases, never in screener fields.
  web_search:
    enabled: true
    max_uses: 5
    tool_version: web_search_20250305
    # Leave empty to search the whole web. Narrow it only if results get noisy.
    allowed_domains: []
  judge:
    # A TAKE needs at least this confidence; below it the call becomes a shadow call.
    min_confidence_to_take: 55
    # A TAKE is impossible unless the Judge explicitly answers the Skeptic.
    require_skeptic_answer: true
    # "No catalyst found" is a MINUS, never a veto: it costs this much
    # confidence and then the Judge weighs what is left (structure, risk, the
    # Skeptic's other points). A thin tape with a clean setup may still be worth
    # taking; a missing press release should not decide that by itself.
    no_catalyst_penalty: 15
    # Below this researcher score, a hit counts as having no catalyst.
    catalyst_score_floor: 4.0
  # Heuristic-backend and learning-loop weighting. skeptic is subtracted:
  # its score is OBJECTION SEVERITY (0 = no objection, 10 = disqualifying).
  weights:
    researcher: 1.0
    technician: 1.0
    risk_manager: 0.6
    skeptic: 1.2
  # Enrichment of role inputs by reusing sibling skills.
  reuse:
    episodic_pivot_analyzer: true   # RESEARCHER catalyst scoring
    weekly_price_action: true       # TECHNICIAN weekly structure
    position_sizer: true            # RISK MANAGER sizing

llm:
  # Hard monthly ceiling. Once month-to-date spend reaches it, the backend
  # reports itself down and hits are recorded UNREVIEWED rather than guessed at.
  monthly_spend_cap_usd: 10.0
  # Server-side web search is billed per search, not per token.
  web_search_per_1k_searches: 10.0
  # USD per 1M tokens. Update when Anthropic pricing changes.
  prices_per_mtok:
    claude-haiku-4-5:
      input: 1.0
      output: 5.0
      cache_read: 0.1
    claude-sonnet-5:
      input: 2.0
      output: 10.0
      cache_read: 0.2
    claude-opus-5:
      input: 5.0
      output: 25.0
      cache_read: 0.5

market:
  timezone: America/New_York
  # Weekend / holiday sessions skip screening; the price update always runs.
  skip_screening_when_closed: true
  regular_open: "09:30"
  regular_close: "16:00"
  # US extended trading. Outside these bounds there is no live tape: relative
  # volume and today's change are yesterday's numbers, so screening overnight
  # would call stale data a signal. The price update still runs.
  extended_open: "04:00"
  extended_close: "20:00"
  # Screening also runs outside regular hours on a trading day (pre/post market),
  # because RelVol and change are still published. Set false to require RTH.
  allow_extended_hours: true
  # US market holidays (static; extend as needed).
  holidays:
    - 2026-01-01
    - 2026-01-19
    - 2026-02-16
    - 2026-04-03
    - 2026-05-25
    - 2026-06-19
    - 2026-07-03
    - 2026-09-07
    - 2026-11-26
    - 2026-12-25
    - 2027-01-01
    - 2027-01-18
    - 2027-02-15
    - 2027-03-26
    - 2027-05-31
    - 2027-06-18
    - 2027-07-05
    - 2027-09-06
    - 2027-11-25
    - 2027-12-24

telegram:
  # Push a summary to Telegram after every run, and (optionally) answer
  # commands from your phone. Credentials come from the environment only:
  #   TELEGRAM_BOT_TOKEN  — from @BotFather
  #   TELEGRAM_CHAT_ID    — your chat with the bot (the bot replies to /id)
  # Without a token the tracker runs exactly as before; nothing is sent.
  enabled: true
  # always  -> a message after every run, including quiet weekend runs
  # changes -> only when something happened (new calls, a close, an error)
  #
  # Set to always at the operator's instruction: every scan reports, including
  # the quiet overnight ones where nothing opened or closed. silent_when_quiet
  # below still suppresses the phone notification sound on those.
  notify_when: always
  # Attach the statistics block to the run notification.
  include_stats: true
  # Attach the per-role verdict lines for each new call. On by default: while
  # you are judging whether the pipeline is any good, the scores and the
  # Skeptic's objection are the whole point of the message.
  include_role_detail: true
  # Send quietly (no phone notification sound) when nothing was opened or closed.
  silent_when_quiet: true
  # Answer commands sent to the bot (needs the poller service; see deploy/).
  allow_commands: true
  # /run triggers a full tracker cycle from your phone. Off by default: a cycle
  # spends LLM budget, and the timer already runs every 4 hours.
  allow_run_command: false
  # Who may use the bot:
  #   invite -> a friend needs an invite link you mint with /invite (default)
  #   open   -> anyone who finds the bot and sends /start
  #   closed -> no new members; existing ones keep their access
  access_mode: invite
  # Chats that always hold admin rights, beyond TELEGRAM_CHAT_ID. Admins mint
  # and revoke invites, remove members, and may use /run when it is enabled.
  admin_chat_ids: []
  # How many people one invite link admits, and how long it stays usable.
  invite_uses: 1
  invite_expiry_days: 14
  # Extra chat ids allowed to read the bot, beyond TELEGRAM_CHAT_ID. Redeemed
  # invites are stored in the database instead; this stays for hand-wired chats.
  extra_chat_ids: []
  # getUpdates long-poll timeout, seconds.
  poll_timeout_seconds: 50
  # Telegram hard-limits a message to 4096 characters; longer messages are split.
  max_message_chars: 3900
  # Persisted getUpdates offset so a restart never replays old commands.
  offset_file: state/lowcap_telegram_offset.json

learning:
  # Minimum closed/resolved calls before the weekly loop draws conclusions.
  min_samples: 10
  lookback_days: 90
  confidence_buckets: [[0, 40], [40, 70], [70, 100]]
